{% extends "base.html" %}

{% block title %}Administrator Login | Student Attendance System{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 72vh;">
  <div class="col-12 col-sm-10 col-md-8 col-lg-5">
    
    <div class="card login-card border-0 shadow">
      <div class="login-header">
        <div class="d-inline-flex p-3 rounded-circle bg-white bg-opacity-10 mb-2">
          <i class="bi bi-shield-lock text-warning fs-1"></i>
        </div>
        <h3 class="fw-bold mb-1">Admin Portal</h3>
        <p class="text-white-50 mb-0 small">Student Attendance Management System</p>
      </div>

      <div class="card-body p-4 p-md-5">
        <form method="POST" action="{{ url_for('login') }}">
          <div class="mb-3">
            <label for="username" class="form-label fw-semibold text-secondary small">ADMIN USERNAME</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control border-start-0 ps-0" id="username" name="username" placeholder="e.g. admin" value="admin" required autofocus>
            </div>
          </div>

          <div class="mb-4">
            <label for="password" class="form-label fw-semibold text-secondary small">PASSWORD</label>
            <div class="input-group">
              <span class="input-group-text bg-light border-end-0 text-muted"><i class="bi bi-key"></i></span>
              <input type="password" class="form-control border-start-0 ps-0" id="password" name="password" placeholder="••••••••" value="password123" required>
            </div>
          </div>

          <div class="d-grid mb-4">
            <button type="submit" class="btn btn-primary py-2 fw-semibold" style="background-color: #1A365D; border-color: #1A365D;">
              <i class="bi bi-box-arrow-in-right me-2"></i> Sign In to Dashboard
            </button>
          </div>

          <div class="bg-light p-3 rounded-3 text-center border">
            <div class="small fw-semibold text-secondary mb-1">
              <i class="bi bi-info-circle-fill text-primary me-1"></i> Prototype Credentials
            </div>
            <div class="small text-muted">
              Username: <code class="text-dark fw-bold">admin</code> &bull; Password: <code class="text-dark fw-bold">password123</code>
            </div>
          </div>
        </form>
      </div>
    </div>

  </div>
</div>
{% endblock %}
